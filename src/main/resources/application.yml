spring:
  application:
    name: hotel-pricing-add
  main:
    web-application-type: none

  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY:your-api-key-here}
      base-url: ${AI_DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        enabled: false
        options:
          model: gpt-5.4
          temperature: 0.3

app:
  ai:
    compatible:
      api-key: ${AI_DASHSCOPE_API_KEY:your-api-key-here}
      base-url: ${AI_DASHSCOPE_BASE_URL:https://yunwu.ai}
      model: gpt-5.4
      temperature: 0.3
      timeout-seconds: 180

logging:
  level:
    com.assignment: INFO
    org.springframework.ai: WARN

add:
  output:
    log-dir: logs
    pretty-print: true

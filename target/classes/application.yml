spring:
  application:
    name: hotel-pricing-add
  main:
    web-application-type: none

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:your-api-key-here}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: gpt-5.4
          temperature: 0.3
          max-tokens: 8192

logging:
  level:
    com.assignment: INFO
    org.springframework.ai: WARN

add:
  output:
    log-dir: logs
    pretty-print: true
